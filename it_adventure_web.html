<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Adventure - Learn & Explore</title>
<style>
:root{--navy:#24466b;--ink:#203653;--blue:#2878c8;--green:#239b68;--muted:#6b7f92}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#dceeff;color:var(--ink);min-height:100vh}
header{height:66px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 5%;gap:15px}
.brand{font-size:21px;font-weight:800;letter-spacing:.5px}
.sub{font-size:12px;font-weight:bold;color:#dceeff;text-align:right}
main{max-width:1100px;margin:auto;padding:28px 22px}
h1,h2,p{margin-top:0}
h1{font-size:clamp(24px,4vw,34px);text-align:center;margin-bottom:10px}
.subtitle{text-align:center;color:#536d86;margin-bottom:25px}
.welcome-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:stretch}
.art-card,.form-card,.room-card,.question-panel{border:2px solid #c5d8e8;border-radius:18px;box-shadow:0 8px 22px #24466b12}
.art-card{background:#b8dcf4;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:390px}
.art-card h2{text-align:center;margin-bottom:5px}
.landscape{width:min(100%,430px);height:auto;margin:12px 0}
.form-card{background:white;padding:30px;display:flex;flex-direction:column;justify-content:center}
label{font-weight:bold;color:#36516b;margin:10px 0 7px}
input{width:100%;padding:13px;border:1px solid #b8c9d8;border-radius:9px;font-size:16px}
.choices{display:flex;gap:20px;margin:8px 0 18px}
.choices label{font-weight:normal;display:flex;align-items:center;gap:7px}
.choices input{width:auto}
button{border:0;border-radius:10px;padding:13px 18px;background:var(--blue);color:white;font-size:14px;font-weight:bold;cursor:pointer;transition:.15s}
button:hover{filter:brightness(.92);transform:translateY(-1px)}
button:disabled{cursor:not-allowed;opacity:.8;transform:none}
.primary{background:var(--green)}
.gray{background:#71849a}
.full{width:100%}
.small-note{text-align:center;color:#71849a;font-size:12px;margin:15px 0 0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px;max-width:780px;margin:28px auto}
.room-card{background:white;text-align:center;padding:22px 18px}
.room-icon{font-size:43px}
.room-card h2{margin:7px 0;font-size:21px}
.room-card p{color:var(--muted);font-size:14px;min-height:18px}
.room-card button{width:100%}
.center{text-align:center}
.question-panel{background:white;padding:26px;margin:25px auto;max-width:850px;text-align:center;border-color:#d5c9ea}
.player-line{color:#7355a0;font-weight:bold;margin-bottom:15px}
.question{font-size:clamp(19px,3vw,25px);font-weight:bold;line-height:1.4}
.progress{color:#75849a;font-weight:bold;font-size:13px;margin-top:12px}
.feedback{text-align:center;min-height:28px;font-weight:bold;margin:10px}
.answers{max-width:850px;margin:auto;display:grid;gap:10px}
.answer{text-align:left;background:#547fb2;font-size:16px}
.answer.correct{background:#239b68}
.answer.wrong{background:#c65c5c}
.actions{display:flex;justify-content:space-between;gap:12px;margin:22px auto;max-width:850px}
.result-box{max-width:700px;margin:55px auto;text-align:center}
.result-box h1{color:#176b43}
.points{font-size:29px;font-weight:bold;color:#c18a20;margin:18px}
.final{background:#fff4dc;border-color:#ead8ae}
footer{text-align:center;color:#71849a;font-size:12px;padding:12px}
@media(max-width:700px){.welcome-grid{grid-template-columns:1fr}.art-card{min-height:280px}.cards{grid-template-columns:1fr}.actions{flex-direction:column}.actions button{width:100%}header{padding:0 16px}.brand{font-size:17px}}
</style>
</head>
<body>
<header><div class="brand">✦ IT ADVENTURE</div><div class="sub" id="headerSub">LEARN • EXPLORE • WIN</div></header>
<main id="app"></main>
<footer>IT ADVENTURE • Learn, explore, and earn points!</footer>
<script>
const ROOMS = {
 "IT Basics":[
  ["What does IT stand for?",["Information Technology","Internet Transfer","Internal Text"],0],
  ["Which one is an input device?",["Monitor","Keyboard","Speaker"],1],
  ["What does CPU mean?",["Central Processing Unit","Computer Power User","Control Program Unit"],0],
  ["Which device prints documents?",["Printer","Mouse","Router"],0],
  ["Which one is an operating system?",["Windows","Python","HTML"],0]
 ],
 "Python":[
  ["What is the output of print('Hello')?",["Hello","print","Error"],0],
  ["Which symbol is used for comments in Python?",["//","#","/*"],1],
  ["Which data type stores whole numbers?",["str","int","list"],1],
  ["Which command gets input from the user?",["input()","print()","write()"],0],
  ["Which keyword checks a condition?",["for","if","def"],1]
 ],
 "Networking":[
  ["Which device connects different networks?",["Router","Keyboard","Monitor"],0],
  ["What is the main purpose of a computer network?",["Connect devices","Draw pictures","Edit videos"],0],
  ["What does IP stand for?",["Internet Protocol","Internal Program","Input Port"],0],
  ["Which device commonly connects devices in a LAN?",["Switch","Printer","Scanner"],0],
  ["What does LAN mean?",["Local Area Network","Large Access Number","Long Area Node"],0]
 ],
 "Database":[
  ["What is a database?",["An organized collection of data","A computer screen","A programming keyboard"],0],
  ["What is a table made of?",["Rows and columns","Pictures only","Sounds"],0],
  ["What does SQL help us do?",["Work with databases","Browse photos","Create animations"],0],
  ["What is a record in a table?",["A row of related data","A column title","A computer cable"],0],
  ["Which one is a database system?",["SQLite","Paint","Calculator"],0]
 ]
};
const COLORS={"IT Basics":"#4d91d2","Python":"#9b70c8","Networking":"#45a98d","Database":"#e69a4b"};
const ICONS={"IT Basics":"🖥️","Python":"🐍","Networking":"🌐","Database":"🗄️"};
const DESCRIPTIONS={"IT Basics":"Discover computers and IT","Python":"Try beginner code questions","Networking":"Explore connected devices","Database":"Learn how data is stored"};
let playerName="",character="🧑‍🚀",score=0,room="",qIndex=0,roomScore=0,answered=false,correctIndex=0;
const app=document.getElementById("app"),headerSub=document.getElementById("headerSub");
function header(text){headerSub.textContent=text}
function welcome(){
 header("LEARN • EXPLORE • WIN");
 app.innerHTML=`
 <div class="welcome-grid">
  <section class="art-card">
   <h2>WELCOME, EXPLORER!</h2><p>Your technology adventure starts here.</p>
   <svg class="landscape" viewBox="0 0 430 280" role="img" aria-label="Cartoon house in a green landscape">
    <circle cx="360" cy="45" r="31" fill="#ffd36a"/><rect x="0" y="220" width="430" height="60" fill="#80c98d"/>
    <g fill="white"><ellipse cx="75" cy="76" rx="38" ry="16"/><ellipse cx="96" cy="62" rx="25" ry="20"/><ellipse cx="320" cy="120" rx="38" ry="16"/><ellipse cx="340" cy="105" rx="25" ry="20"/></g>
    <path d="M130 220V125L215 62 300 125V220Z" fill="#f3b75d" stroke="#9a6937" stroke-width="4"/>
    <path d="M112 128L215 45 318 128Z" fill="#d96f62" stroke="#9a4b48" stroke-width="4"/>
    <rect x="195" y="162" width="42" height="58" fill="#76523e"/><rect x="151" y="145" width="29" height="29" fill="#aee5f5" stroke="#4f829b" stroke-width="3"/><rect x="250" y="145" width="29" height="29" fill="#aee5f5" stroke="#4f829b" stroke-width="3"/>
    <text x="215" y="258" text-anchor="middle" font-size="16" font-weight="bold" fill="#24513b">THE WORLD OF IT</text>
   </svg>
  </section>
  <section class="form-card">
   <h2 class="center">Create your player</h2>
   <label for="playerName">Your name</label><input id="playerName" maxlength="30" placeholder="Enter your name">
   <label>Choose your explorer</label>
   <div class="choices"><label><input type="radio" name="character" value="Boy" checked> 🧑‍🚀 Boy</label><label><input type="radio" name="character" value="Girl"> 👩‍🚀 Girl</label></div>
   <button class="primary full" onclick="startGame()">START ADVENTURE ➜</button>
   <p class="small-note">4 rooms • 20 questions • 1 big adventure</p>
  </section>
 </div>`;
}
function startGame(){
 const name=document.getElementById("playerName").value.trim();
 if(!name){alert("Please enter your name.");return}
 playerName=name;
 character=document.querySelector('input[name="character"]:checked').value==="Boy"?"🧑‍🚀":"👩‍🚀";
 score=0;showMap();
}
function showMap(){
 header(`PLAYER: ${playerName.toUpperCase()} • SCORE: ${score}`);
 app.innerHTML=`<h1>CHOOSE YOUR NEXT ROOM</h1><p class="subtitle">${character} Hello ${escapeHtml(playerName)}! Pick a door and begin learning.</p>
 <div class="cards">${Object.keys(ROOMS).map(r=>`<article class="room-card"><div class="room-icon">${ICONS[r]}</div><h2>${r}</h2><p>${DESCRIPTIONS[r]}</p><button style="background:${COLORS[r]}" onclick="startRoom('${r}')">OPEN DOOR ➜</button></article>`).join("")}</div>
 <div class="center"><button class="gray" onclick="welcome()">HOME</button></div>`;
}
function startRoom(r){room=r;qIndex=0;roomScore=0;showQuestion()}
function showQuestion(){
 answered=false;
 const [question,answers,correct]=ROOMS[room][qIndex];
 const order=[0,1,2].sort(()=>Math.random()-.5);
 const options=order.map(i=>answers[i]);correctIndex=order.indexOf(correct);
 header(`${room.toUpperCase()} • SCORE: ${score}`);
 app.innerHTML=`<h1>${ICONS[room]} ${room.toUpperCase()} CHALLENGE</h1>
 <p class="progress center">QUESTION ${qIndex+1} OF ${ROOMS[room].length}</p>
 <section class="question-panel"><div class="player-line">${character} ${escapeHtml(playerName)}, can you solve this?</div><div class="question">${question}</div></section>
 <div class="feedback" id="feedback">Choose one answer:</div>
 <div class="answers">${options.map((a,i)=>`<button class="answer" id="answer${i}" onclick="checkAnswer(${i})">${String.fromCharCode(65+i)}　 ${a}</button>`).join("")}</div>
 <div class="actions"><button class="gray" onclick="showMap()">← ADVENTURE MAP</button><button class="primary" id="nextBtn" style="display:none" onclick="nextQuestion()">NEXT QUESTION ➜</button></div>`;
}
function checkAnswer(selected){
 if(answered)return;answered=true;
 const buttons=[0,1,2].map(i=>document.getElementById("answer"+i));
 buttons.forEach(b=>b.disabled=true);
 const feedback=document.getElementById("feedback");
 if(selected===correctIndex){
  score+=10;roomScore+=10;feedback.textContent="✓ Correct! You earned 10 points.";feedback.style.color="#16834a";
 }else{
  feedback.textContent="Not quite! The correct answer is highlighted.";feedback.style.color="#b74747";
  buttons[selected].classList.add("wrong");
 }
 buttons[correctIndex].classList.add("correct");
 document.getElementById("nextBtn").style.display="inline-block";
 header(`${room.toUpperCase()} • SCORE: ${score}`);
}
function nextQuestion(){qIndex++;if(qIndex<ROOMS[room].length)showQuestion();else showRoomResult()}
function showRoomResult(){
 header("ROOM COMPLETED");
 app.innerHTML=`<section class="result-box"><h1>✦ WELL DONE! ✦</h1><h2>${character} ${escapeHtml(playerName)}</h2><p>You completed ${room}!</p><div class="points">+${roomScore} POINTS</div><p><b>Total score: ${score}</b></p><button onclick="showMap()">BACK TO ADVENTURE MAP</button> <button class="primary" onclick="finishGame()">FINISH GAME</button></section>`;
}
function finishGame(){
 const results=JSON.parse(localStorage.getItem("itAdventureResults")||"[]");
 results.push({name:playerName,character,score,date:new Date().toLocaleString()});
 localStorage.setItem("itAdventureResults",JSON.stringify(results));
 header("ADVENTURE COMPLETE");
 app.innerHTML=`<section class="result-box final"><h1>🏆 YOU ARE A TECH EXPLORER!</h1><h2>${character} ${escapeHtml(playerName)}</h2><p>You completed your IT adventure!</p><div class="points">FINAL SCORE: ${score} / 200</div><p>Your result was saved in this browser.</p><button class="primary" onclick="resetGame()">PLAY AGAIN</button> <button class="gray" onclick="showScores()">SCORES</button></section>`;
}
function showScores(){
 const results=JSON.parse(localStorage.getItem("itAdventureResults")||"[]").slice().reverse();
 header("PLAYER RESULTS");
 app.innerHTML=`<h1>PLAYER RESULTS</h1>${results.length?`<div class="question-panel">${results.map((r,i)=>`<p><b>${i+1}. ${escapeHtml(r.name)}</b> — ${r.score}/200 <small>(${escapeHtml(r.date)})</small></p>`).join("")}</div>`:'<p class="center">No saved results yet.</p>'}<div class="center"><button onclick="resetGame()">BACK</button></div>`;
}
function resetGame(){playerName="";score=0;welcome()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
welcome();
</script>
</body>
</html>
